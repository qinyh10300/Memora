[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memora-api"
version = "0.1.0"
description = "Memora API and background worker"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.135,<1",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.37,<1",
]

[project.scripts]
memora-api = "memora.cli:main"
memora-export-openapi = "memora.export_openapi:main"
memora-seed = "memora.identity.seed:main"
memora-worker = "memora.worker:main"

[dependency-groups]
dev = [
  "httpx2>=2.7,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memora"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["memora"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=memora --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
