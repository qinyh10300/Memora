name: memora

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_USER: ${POSTGRES_USER:-memora}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment: &api-environment
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-memora}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-memora}
      SESSION_SECRET: ${SESSION_SECRET:-development-only-change-me}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1209600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_USER_1_EMAIL: ${SEED_USER_1_EMAIL:-alex@memora.local}
      SEED_USER_1_DISPLAY_NAME: ${SEED_USER_1_DISPLAY_NAME:-Alex}
      SEED_USER_1_PASSWORD: ${SEED_USER_1_PASSWORD:-memora-local-alex}
      SEED_USER_2_EMAIL: ${SEED_USER_2_EMAIL:-blair@memora.local}
      SEED_USER_2_DISPLAY_NAME: ${SEED_USER_2_DISPLAY_NAME:-Blair}
      SEED_USER_2_PASSWORD: ${SEED_USER_2_PASSWORD:-memora-local-blair}
      SEED_USER_3_EMAIL: ${SEED_USER_3_EMAIL:-casey@memora.local}
      SEED_USER_3_DISPLAY_NAME: ${SEED_USER_3_DISPLAY_NAME:-Casey}
      SEED_USER_3_PASSWORD: ${SEED_USER_3_PASSWORD:-memora-local-casey}
      SEED_USER_4_EMAIL: ${SEED_USER_4_EMAIL:-devon@memora.local}
      SEED_USER_4_DISPLAY_NAME: ${SEED_USER_4_DISPLAY_NAME:-Devon}
      SEED_USER_4_PASSWORD: ${SEED_USER_4_PASSWORD:-memora-local-devon}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://yunwu.ai/v1}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://yunwu.ai/v1}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
      AI_CHAT_MAX_OUTPUT_TOKENS: ${AI_CHAT_MAX_OUTPUT_TOKENS:-1200}
      AI_EMBEDDING_MAX_ATTEMPTS: ${AI_EMBEDDING_MAX_ATTEMPTS:-5}
      AI_JOB_RETRY_BASE_SECONDS: ${AI_JOB_RETRY_BASE_SECONDS:-15}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["uv", "run", "--no-sync", "memora-seed"]
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["uv", "run", "--no-sync", "memora-worker", "--interval", "5"]
    environment: *api-environment
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
