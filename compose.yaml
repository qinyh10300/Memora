name: memora

services:
  fake-ai:
    image: python:3.13-slim
    profiles: ["e2e"]
    command: ["python", "/opt/memora/fake-ai-provider.py"]
    volumes:
      - ./scripts/fake-ai-provider.py:/opt/memora/fake-ai-provider.py:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/health', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: "no"

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_USER: ${POSTGRES_USER:-memora}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    image: ${MEMORA_MIGRATE_IMAGE:-memora-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment: &api-environment
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-memora}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-memora}
      SESSION_SECRET: ${SESSION_SECRET:-development-only-change-me}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1209600}
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-false}
      EMAIL_VERIFICATION_CODE_TTL_SECONDS: ${EMAIL_VERIFICATION_CODE_TTL_SECONDS:-600}
      EMAIL_VERIFICATION_MAX_ATTEMPTS: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:-5}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_FROM_EMAIL: ${EMAIL_SMTP_FROM_EMAIL:-}
      EMAIL_SMTP_STARTTLS: ${EMAIL_SMTP_STARTTLS:-true}
      EMAIL_SMTP_USE_SSL: ${EMAIL_SMTP_USE_SSL:-false}
      EMAIL_SMTP_TIMEOUT_SECONDS: ${EMAIL_SMTP_TIMEOUT_SECONDS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OBSERVABILITY_SINK_URL: ${OBSERVABILITY_SINK_URL:-}
      OBSERVABILITY_SINK_TOKEN: ${OBSERVABILITY_SINK_TOKEN:-}
      OBSERVABILITY_SINK_TIMEOUT_SECONDS: ${OBSERVABILITY_SINK_TIMEOUT_SECONDS:-2}
      SEED_DEVELOPMENT_DATA_ENABLED: ${SEED_DEVELOPMENT_DATA_ENABLED:-false}
      SEED_USER_1_EMAIL: ${SEED_USER_1_EMAIL:-alex@memora.local}
      SEED_USER_1_DISPLAY_NAME: ${SEED_USER_1_DISPLAY_NAME:-Alex}
      SEED_USER_1_PASSWORD: ${SEED_USER_1_PASSWORD:-memora-local-alex}
      SEED_USER_2_EMAIL: ${SEED_USER_2_EMAIL:-blair@memora.local}
      SEED_USER_2_DISPLAY_NAME: ${SEED_USER_2_DISPLAY_NAME:-Blair}
      SEED_USER_2_PASSWORD: ${SEED_USER_2_PASSWORD:-memora-local-blair}
      SEED_USER_3_EMAIL: ${SEED_USER_3_EMAIL:-casey@memora.local}
      SEED_USER_3_DISPLAY_NAME: ${SEED_USER_3_DISPLAY_NAME:-Casey}
      SEED_USER_3_PASSWORD: ${SEED_USER_3_PASSWORD:-memora-local-casey}
      SEED_USER_4_EMAIL: ${SEED_USER_4_EMAIL:-devon@memora.local}
      SEED_USER_4_DISPLAY_NAME: ${SEED_USER_4_DISPLAY_NAME:-Devon}
      SEED_USER_4_PASSWORD: ${SEED_USER_4_PASSWORD:-memora-local-devon}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://yunwu.ai/v1}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_MODEL_REGISTRY_JSON: ${AI_MODEL_REGISTRY_JSON:-}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://yunwu.ai/v1}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
      AI_WEB_SEARCH_ENABLED: ${AI_WEB_SEARCH_ENABLED:-true}
      AI_WEB_SEARCH_MODEL: ${AI_WEB_SEARCH_MODEL:-}
      AI_WEB_SEARCH_TIMEOUT_SECONDS: ${AI_WEB_SEARCH_TIMEOUT_SECONDS:-90}
      AI_CHAT_MAX_OUTPUT_TOKENS: ${AI_CHAT_MAX_OUTPUT_TOKENS:-2400}
      AI_MODEL_PRICING_JSON: ${AI_MODEL_PRICING_JSON:-}
      AI_IMAGE_BASE_URL: ${AI_IMAGE_BASE_URL:-https://yunwu.ai/v1}
      AI_IMAGE_API_KEY: ${AI_IMAGE_API_KEY:-}
      AI_IMAGE_MODEL_REGISTRY_JSON: ${AI_IMAGE_MODEL_REGISTRY_JSON:-}
      AI_IMAGE_REQUEST_TIMEOUT_SECONDS: ${AI_IMAGE_REQUEST_TIMEOUT_SECONDS:-180}
      AI_IMAGE_MAX_ATTEMPTS: ${AI_IMAGE_MAX_ATTEMPTS:-3}
      AI_VISUALS_ENABLED: ${AI_VISUALS_ENABLED:-true}
      TEAM_INTELLIGENCE_ENABLED: ${TEAM_INTELLIGENCE_ENABLED:-true}
      AI_TASK_CREDIT_COSTS_JSON: ${AI_TASK_CREDIT_COSTS_JSON:-}
      AI_EMBEDDING_MAX_ATTEMPTS: ${AI_EMBEDDING_MAX_ATTEMPTS:-5}
      AI_JOB_RETRY_BASE_SECONDS: ${AI_JOB_RETRY_BASE_SECONDS:-15}
      DOCUMENT_PARSE_MAX_PAGES: ${DOCUMENT_PARSE_MAX_PAGES:-100}
      DOCUMENT_PARSE_MAX_CHARS: ${DOCUMENT_PARSE_MAX_CHARS:-500000}
      DOCUMENT_PARSE_TIMEOUT_SECONDS: ${DOCUMENT_PARSE_TIMEOUT_SECONDS:-120}
      DOCUMENT_PARSE_MAX_ATTEMPTS: ${DOCUMENT_PARSE_MAX_ATTEMPTS:-3}
      DOCUMENT_PARSE_MAX_CONCURRENCY: ${DOCUMENT_PARSE_MAX_CONCURRENCY:-1}
      DOCUMENT_CHUNK_MAX_CHARS: ${DOCUMENT_CHUNK_MAX_CHARS:-1400}
      DOCUMENT_CHUNK_OVERLAP_CHARS: ${DOCUMENT_CHUNK_OVERLAP_CHARS:-120}
      DOCUMENT_OCR_MIN_TEXT_CHARS: ${DOCUMENT_OCR_MIN_TEXT_CHARS:-40}
      DOCUMENT_OCR_PAGE_TIMEOUT_SECONDS: ${DOCUMENT_OCR_PAGE_TIMEOUT_SECONDS:-30}
      DOCUMENT_OCR_LANGUAGES: ${DOCUMENT_OCR_LANGUAGES:-chi_sim+eng}
      HTTP_PROXY: ${DOCKER_HTTP_PROXY:-}
      HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-}
      ALL_PROXY: ${DOCKER_ALL_PROXY:-}
      NO_PROXY: ${DOCKER_NO_PROXY:-localhost,127.0.0.1,db,api,web,worker,proxy,fake-ai}
      http_proxy: ${DOCKER_HTTP_PROXY:-}
      https_proxy: ${DOCKER_HTTPS_PROXY:-}
      all_proxy: ${DOCKER_ALL_PROXY:-}
      no_proxy: ${DOCKER_NO_PROXY:-localhost,127.0.0.1,db,api,web,worker,proxy,fake-ai}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    image: ${MEMORA_SEED_IMAGE:-memora-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["uv", "run", "--no-sync", "memora-seed"]
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: ${MEMORA_API_IMAGE:-memora-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    dns: &ai-dns
      - ${DOCKER_DNS_PRIMARY:-223.5.5.5}
      - ${DOCKER_DNS_SECONDARY:-1.1.1.1}
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    image: ${MEMORA_WORKER_IMAGE:-memora-worker:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["uv", "run", "--no-sync", "memora-worker", "--interval", "5"]
    environment: *api-environment
    dns: *ai-dns
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: ${MEMORA_WEB_IMAGE:-memora-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
